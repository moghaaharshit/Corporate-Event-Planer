<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Events | Admin Panel</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="logo.png">
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8f9fa; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #C9A96E; border-radius: 3px; }
        .sidebar-item.active { background: rgba(201,169,110,0.12); color: #C9A96E; border-right: 3px solid #C9A96E; }
        .sidebar-item:hover { background: rgba(201,169,110,0.06); }
        .upload-zone { border: 2px dashed #d1d5db; transition: all 0.3s; }
        .upload-zone:hover, .upload-zone.dragover { border-color: #C9A96E; background: rgba(201,169,110,0.04); }
        .toast { animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #C9A96E; }
    </style>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { gold: '#C9A96E', 'gold-light': '#D4B87A' } } }
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ─── FIREBASE CONFIG ──────────────────────────────────
        const firebaseConfig = {
            apiKey: "AIzaSyAASaHtYncdmju3EkX-WJLqU7BLKIzV7Lk",
            authDomain: "sky-events-48773.firebaseapp.com",
            projectId: "sky-events-48773",
            databaseURL: "https://sky-events-48773-default-rtdb.firebaseio.com",
            storageBucket: "sky-events-48773.firebasestorage.app",
            messagingSenderId: "358695065967",
            appId: "1:358695065967:web:0c3878bb9ed844fe74309a"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        console.log('Firebase Firestore initialized');

        // ─── CLOUDINARY CONFIG ────────────────────────────────
        const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/diavzcw31/image/upload";
        const CLOUDINARY_UPLOAD_PRESET = "Sky Events";

        // ─── UPLOAD TO CLOUDINARY ─────────────────────────────
        const uploadToCloudinary = async (file) => {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
            formData.append('folder', 'sky-events');
            console.log('Uploading to Cloudinary...', file.name);
            const res = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
            const data = await res.json();
            console.log('Cloudinary response:', data);
            if (data.error) throw new Error(data.error.message);
            return data.secure_url;
        };

        // ─── TOAST ────────────────────────────────────────────
        const Toast = ({ message, type }) => (
            <div className={`toast fixed top-5 right-5 z-50 px-5 py-3 rounded-lg shadow-lg text-white text-sm font-medium flex items-center gap-2 ${
                type === 'success' ? 'bg-emerald-500' : type === 'error' ? 'bg-red-500' : 'bg-gold'
            }`}>
                <i className={`fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}`}></i>
                {message}
            </div>
        );

        // ─── LOGIN ────────────────────────────────────────────
        const Login = ({ onLogin }) => {
            const [pass, setPass] = useState('');
            const [error, setError] = useState('');
            const handleSubmit = (e) => {
                e.preventDefault();
                if (pass === 'skyevents2024') { onLogin(); }
                else { setError('Incorrect password'); }
            };
            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-50 to-gray-100 px-4">
                    <div className="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm">
                        <div className="text-center mb-8">
                            <img src="logo.png" alt="Sky Events" className="h-12 w-auto mx-auto mb-4 rounded-lg" />
                            <h1 className="text-xl font-bold text-gray-800">Admin Panel</h1>
                            <p className="text-gray-400 text-xs mt-1">Sky Events — Content Management</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-semibold text-gray-600 mb-1.5">Password</label>
                                <input type="password" value={pass} onChange={e => { setPass(e.target.value); setError(''); }}
                                    placeholder="Enter admin password" autoFocus
                                    className="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm" />
                                {error && <p className="text-red-500 text-xs mt-1">{error}</p>}
                            </div>
                            <button type="submit" className="w-full bg-gray-900 text-white py-3 rounded-lg text-sm font-semibold hover:bg-gold transition-all">
                                SIGN IN <i className="fas fa-arrow-right ml-1 text-xs"></i>
                            </button>
                        </form>
                        <p className="text-center text-[10px] text-gray-300 mt-6">© 2024 Sky Events</p>
                    </div>
                </div>
            );
        };

        // ─── IMAGE UPLOAD COMPONENT ────────────────────────────
        const ImageUpload = ({ onUpload, multiple = false, existingImages = [], onRemove }) => {
            const [uploading, setUploading] = useState(false);
            const [dragOver, setDragOver] = useState(false);
            const inputRef = useRef();

            const handleFiles = async (files) => {
                setUploading(true);
                try {
                    for (const file of files) {
                        const url = await uploadToCloudinary(file);
                        onUpload(url);
                    }
                } catch (err) { alert('Upload failed: ' + err.message); }
                setUploading(false);
            };

            return (
                <div className="space-y-3">
                    <div onDragOver={e => { e.preventDefault(); setDragOver(true); }}
                         onDragLeave={() => setDragOver(false)}
                         onDrop={e => { e.preventDefault(); setDragOver(false); handleFiles(e.dataTransfer.files); }}
                         onClick={() => inputRef.current.click()}
                         className={`upload-zone rounded-xl p-6 text-center cursor-pointer ${dragOver ? 'dragover' : ''}`}>
                        <input ref={inputRef} type="file" accept="image/*" multiple={multiple}
                               className="hidden" onChange={e => handleFiles(e.target.files)} />
                        {uploading ? (
                            <div className="flex items-center justify-center gap-2 text-gold">
                                <i className="fas fa-spinner fa-spin"></i>
                                <span className="text-sm">Uploading...</span>
                            </div>
                        ) : (
                            <div>
                                <i className="fas fa-cloud-upload-alt text-3xl text-gray-300 mb-2"></i>
                                <p className="text-sm text-gray-500">Click or drag images here</p>
                                <p className="text-[10px] text-gray-400 mt-1">JPG, PNG, WebP — Max 5MB</p>
                            </div>
                        )}
                    </div>
                    {existingImages.length > 0 && (
                        <div className="grid grid-cols-4 gap-2">
                            {existingImages.map((img, i) => (
                                <div key={i} className="relative group rounded-lg overflow-hidden aspect-square bg-gray-100">
                                    <img src={img} className="w-full h-full object-cover" alt="" />
                                    {onRemove && (
                                        <button onClick={() => onRemove(i)}
                                            className="absolute top-1 right-1 w-5 h-5 bg-red-500 text-white rounded-full text-[10px] opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                            <i className="fas fa-times"></i>
                                        </button>
                                    )}
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        // ─── SECTION HEADER ───────────────────────────────────
        const SectionHeader = ({ title, subtitle, onAdd, addLabel }) => (
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-6">
                <div>
                    <h2 className="text-xl font-bold text-gray-800">{title}</h2>
                    {subtitle && <p className="text-gray-400 text-xs mt-0.5">{subtitle}</p>}
                </div>
                {onAdd && (
                    <button onClick={onAdd} className="bg-gray-900 text-white px-5 py-2.5 rounded-lg text-xs font-semibold hover:bg-gold transition-all flex items-center gap-2">
                        <i className="fas fa-plus text-[10px]"></i> {addLabel || 'ADD NEW'}
                    </button>
                )}
            </div>
        );

        // ─── EMPTY STATE ──────────────────────────────────────
        const EmptyState = ({ icon, text }) => (
            <div className="text-center py-16 bg-white rounded-xl border border-gray-100">
                <i className={`fas ${icon} text-4xl text-gray-200 mb-3`}></i>
                <p className="text-gray-400 text-sm">{text}</p>
            </div>
        );

        // ─── FORM FIELD ───────────────────────────────────────
        const FormField = ({ label, children, full }) => (
            <div className={full ? 'sm:col-span-2' : ''}>
                <label className="block text-xs font-semibold text-gray-600 mb-1.5">{label}</label>
                {children}
            </div>
        );

        const Input = ({ value, onChange, placeholder, type = 'text', ...props }) => (
            <input type={type} value={value} onChange={onChange} placeholder={placeholder}
                className="w-full border border-gray-200 rounded-lg px-3.5 py-2.5 text-sm bg-white" {...props} />
        );

        const Textarea = ({ value, onChange, placeholder, rows = 3 }) => (
            <textarea value={value} onChange={onChange} placeholder={placeholder} rows={rows}
                className="w-full border border-gray-200 rounded-lg px-3.5 py-2.5 text-sm bg-white resize-none" />
        );

        const Select = ({ value, onChange, options, placeholder }) => (
            <select value={value} onChange={onChange} className="w-full border border-gray-200 rounded-lg px-3.5 py-2.5 text-sm bg-white">
                {placeholder && <option value="">{placeholder}</option>}
                {options.map(o => <option key={o} value={o}>{o}</option>)}
            </select>
        );

        // ─── MODAL ────────────────────────────────────────────
        const Modal = ({ children, onClose }) => (
            <div className="fixed inset-0 bg-black/40 z-50 flex items-start justify-center pt-10 px-4 overflow-y-auto pb-10" onClick={onClose}>
                <div className="bg-white rounded-2xl w-full max-w-2xl shadow-2xl" onClick={e => e.stopPropagation()}>
                    <div className="flex justify-between items-center px-6 py-4 border-b border-gray-100">
                        <h3 className="font-bold text-gray-800">{children[0]}</h3>
                        <button onClick={onClose} className="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center hover:bg-gray-200 transition-all">
                            <i className="fas fa-times text-gray-500 text-xs"></i>
                        </button>
                    </div>
                    <div className="p-6">{children.slice(1)}</div>
                </div>
            </div>
        );

        // ─── DASHBOARD ────────────────────────────────────────
        const Dashboard = ({ data }) => {
            const cards = [
                { label: 'Weddings', value: data.weddings?.length || 0, icon: 'fa-heart', color: 'bg-pink-50 text-pink-500' },
                { label: 'Venues', value: data.venues?.length || 0, icon: 'fa-hotel', color: 'bg-blue-50 text-blue-500' },
                { label: 'Décor Items', value: data.decor?.length || 0, icon: 'fa-palette', color: 'bg-purple-50 text-purple-500' },
                { label: 'Gallery Images', value: data.gallery?.length || 0, icon: 'fa-images', color: 'bg-amber-50 text-amber-500' },
                { label: 'Testimonials', value: data.testimonials?.length || 0, icon: 'fa-quote-right', color: 'bg-emerald-50 text-emerald-500' },
            ];
            return (
                <div>
                    <h2 className="text-xl font-bold text-gray-800 mb-1">Dashboard</h2>
                    <p className="text-gray-400 text-xs mb-6">Overview of your website content</p>
                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
                        {cards.map((c, i) => (
                            <div key={i} className="bg-white rounded-xl p-5 border border-gray-100">
                                <div className={`w-10 h-10 rounded-lg ${c.color} flex items-center justify-center mb-3`}>
                                    <i className={`fas ${c.icon} text-sm`}></i>
                                </div>
                                <p className="text-2xl font-bold text-gray-800">{c.value}</p>
                                <p className="text-gray-400 text-xs mt-0.5">{c.label}</p>
                            </div>
                        ))}
                    </div>
                    <div className="mt-8 bg-white rounded-xl p-6 border border-gray-100">
                        <h3 className="font-bold text-gray-800 mb-2">Quick Actions</h3>
                        <p className="text-gray-400 text-xs mb-4">Use the sidebar to manage each section of your website.</p>
                        <div className="flex flex-wrap gap-2">
                            <span className="bg-gray-100 text-gray-600 text-[10px] px-3 py-1.5 rounded-full font-medium">Weddings → Add new wedding projects</span>
                            <span className="bg-gray-100 text-gray-600 text-[10px] px-3 py-1.5 rounded-full font-medium">Venues → Add premium venues</span>
                            <span className="bg-gray-100 text-gray-600 text-[10px] px-3 py-1.5 rounded-full font-medium">Gallery → Upload photos</span>
                            <span className="bg-gray-100 text-gray-600 text-[10px] px-3 py-1.5 rounded-full font-medium">Testimonials → Add client reviews</span>
                        </div>
                    </div>
                </div>
            );
        };

        // ─── WEDDINGS SECTION ─────────────────────────────────
        const WeddingsSection = ({ data, onSave, onDelete, toast }) => {
            const [editItem, setEditItem] = useState(null);
            const [showModal, setShowModal] = useState(false);
            const empty = { couple: '', venue: '', type: '', img: '', desc: '', category: '', images: [] };

            const handleSave = (item) => {
                onSave('weddings', item);
                setShowModal(false);
                setEditItem(null);
                toast('Wedding saved successfully', 'success');
            };

            return (
                <div>
                    <SectionHeader title="Weddings" subtitle="Manage your wedding portfolio" onAdd={() => { setEditItem({...empty}); setShowModal(true); }} addLabel="ADD WEDDING" />
                    {(!data.weddings || data.weddings.length === 0) ? (
                        <EmptyState icon="fa-heart" text="No weddings added yet" />
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {data.weddings.map((w, i) => (
                                <div key={i} className="bg-white rounded-xl border border-gray-100 overflow-hidden flex flex-col">
                                    {w.img && <img src={w.img} className="w-full h-40 object-cover" alt={w.couple} />}
                                    <div className="p-4 flex-1">
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <h3 className="font-bold text-sm">{w.couple}</h3>
                                                <p className="text-gray-400 text-xs">{w.venue} • {w.type}</p>
                                            </div>
                                            <div className="flex gap-1">
                                                <button onClick={() => { setEditItem({...w, _index: i}); setShowModal(true); }}
                                                    className="w-7 h-7 rounded-lg bg-gray-100 flex items-center justify-center hover:bg-gold/10 transition-all">
                                                    <i className="fas fa-pen text-[10px] text-gray-500"></i>
                                                </button>
                                                <button onClick={() => { onDelete('weddings', i); toast('Wedding deleted', 'success'); }}
                                                    className="w-7 h-7 rounded-lg bg-gray-100 flex items-center justify-center hover:bg-red-50 transition-all">
                                                    <i className="fas fa-trash text-[10px] text-gray-400"></i>
                                                </button>
                                            </div>
                                        </div>
                                        {w.desc && <p className="text-gray-500 text-xs mt-2 line-clamp-2">{w.desc}</p>}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                    {showModal && (
                        <Modal onClose={() => { setShowModal(false); setEditItem(null); }}>
                            <>{editItem?._index !== undefined ? 'Edit Wedding' : 'Add Wedding'}</>
                            <WeddingForm item={editItem} onSave={handleSave} />
                        </Modal>
                    )}
                </div>
            );
        };

        const WeddingForm = ({ item, onSave }) => {
            const [form, setForm] = useState(item || {});
            const set = (k, v) => setForm(p => ({...p, [k]: v}));
            return (
                <div className="space-y-4">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <FormField label="Couple Name *"><Input value={form.couple||''} onChange={e=>set('couple',e.target.value)} placeholder="e.g. Priya & Arjun" /></FormField>
                        <FormField label="Venue"><Input value={form.venue||''} onChange={e=>set('venue',e.target.value)} placeholder="e.g. The Leela, Mumbai" /></FormField>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <FormField label="Event Type"><Input value={form.type||''} onChange={e=>set('type',e.target.value)} placeholder="e.g. Grand Celebration" /></FormField>
                        <FormField label="Category"><Select value={form.category||''} onChange={e=>set('category',e.target.value)} placeholder="Select category" options={['Wedding','Reception','Mehendi','Sangeet','Destination']} /></FormField>
                    </div>
                    <FormField label="Description"><Textarea value={form.desc||''} onChange={e=>set('desc',e.target.value)} placeholder="Short description of the wedding..." /></FormField>
                    <FormField label="Main Image" full>
                        <ImageUpload onUpload={url => set('img', url)} />
                        {form.img && <img src={form.img} className="mt-2 h-24 rounded-lg object-cover" alt="" />}
                    </FormField>
                    <FormField label="Additional Images" full>
                        <ImageUpload multiple onUpload={url => set('images', [...(form.images||[]), url])}
                            existingImages={form.images||[]} onRemove={idx => set('images', form.images.filter((_,i)=>i!==idx))} />
                    </FormField>
                    <div className="flex justify-end gap-2 pt-2">
                        <button onClick={() => onSave(form)} className="bg-gray-900 text-white px-6 py-2.5 rounded-lg text-xs font-semibold hover:bg-gold transition-all">
                            SAVE WEDDING
                        </button>
                    </div>
                </div>
            );
        };

        // ─── VENUES SECTION ───────────────────────────────────
        const VenuesSection = ({ data, onSave, onDelete, toast }) => {
            const [editItem, setEditItem] = useState(null);
            const [showModal, setShowModal] = useState(false);
            const empty = { name: '', location: '', type: '', capacity: '', img: '', desc: '', functions: '' };

            const handleSave = (item) => {
                onSave('venues', item);
                setShowModal(false); setEditItem(null);
                toast('Venue saved successfully', 'success');
            };

            return (
                <div>
                    <SectionHeader title="Venues" subtitle="Manage premium wedding venues" onAdd={() => { setEditItem({...empty}); setShowModal(true); }} addLabel="ADD VENUE" />
                    {(!data.venues || data.venues.length === 0) ? (
                        <EmptyState icon="fa-hotel" text="No venues added yet" />
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {data.venues.map((v, i) => (
                                <div key={i} className="bg-white rounded-xl border border-gray-100 overflow-hidden">
                                    {v.img && <img src={v.img} className="w-full h-32 object-cover" alt={v.name} />}
                                    <div className="p-4">
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <h3 className="font-bold text-sm">{v.name}</h3>
                                                <p className="text-gray-400 text-xs">{v.location} • {v.type}</p>
                                                {v.capacity && <p className="text-gray-400 text-[10px] mt-0.5">{v.capacity}</p>}
                                            </div>
                                            <div className="flex gap-1">
                                                <button onClick={() => { setEditItem({...v, _index: i}); setShowModal(true); }} className="w-7 h-7 rounded-lg bg-gray-100 flex items-center justify-center hover:bg-gold/10"><i className="fas fa-pen text-[10px] text-gray-500"></i></button>
                                                <button onClick={() => { onDelete('venues', i); toast('Venue deleted','success'); }} className="w-7 h-7 rounded-lg bg-gray-100 flex items-center justify-center hover:bg-red-50"><i className="fas fa-trash text-[10px] text-gray-400"></i></button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                    {showModal && (
                        <Modal onClose={() => { setShowModal(false); setEditItem(null); }}>
                            <>{editItem?._index !== undefined ? 'Edit Venue' : 'Add Venue'}</>
                            <VenueForm item={editItem} onSave={handleSave} />
                        </Modal>
                    )}
                </div>
            );
        };

        const VenueForm = ({ item, onSave }) => {
            const [form, setForm] = useState(item || {});
            const set = (k, v) => setForm(p => ({...p, [k]: v}));
            return (
                <div className="space-y-4">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <FormField label="Venue Name *"><Input value={form.name||''} onChange={e=>set('name',e.target.value)} placeholder="e.g. The Leela Palace" /></FormField>
                        <FormField label="Location"><Input value={form.location||''} onChange={e=>set('location',e.target.value)} placeholder="e.g. Mumbai" /></FormField>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <FormField label="Type"><Select value={form.type||''} onChange={e=>set('type',e.target.value)} placeholder="Select type" options={['Luxury Hotel','Premium Property','Destination Venue','Grand Ballroom','Outdoor Venue','Banquet Hall']} /></FormField>
                        <FormField label="Capacity"><Input value={form.capacity||''} onChange={e=>set('capacity',e.target.value)} placeholder="e.g. 200–800 guests" /></FormField>
                    </div>
                    <FormField label="Suitable Functions"><Input value={form.functions||''} onChange={e=>set('functions',e.target.value)} placeholder="e.g. Wedding, Reception, Mehendi" /></FormField>
                    <FormField label="Description"><Textarea value={form.desc||''} onChange={e=>set('desc',e.target.value)} placeholder="Short venue description..." /></FormField>
                    <FormField label="Venue Image" full>
                        <ImageUpload onUpload={url => set('img', url)} />
                        {form.img && <img src={form.img} className="mt-2 h-24 rounded-lg object-cover" alt="" />}
                    </FormField>
                    <div className="flex justify-end gap-2 pt-2">
                        <button onClick={() => onSave(form)} className="bg-gray-900 text-white px-6 py-2.5 rounded-lg text-xs font-semibold hover:bg-gold transition-all">SAVE VENUE</button>
                    </div>
                </div>
            );
        };

        // ─── DÉCOR SECTION ────────────────────────────────────
        const DecorSection = ({ data, onSave, onDelete, toast }) => {
            const [editItem, setEditItem] = useState(null);
            const [showModal, setShowModal] = useState(false);
            const empty = { name: '', img: '', category: '' };

            const handleSave = (item) => {
                onSave('decor', item);
                setShowModal(false); setEditItem(null);
                toast('Décor item saved', 'success');
            };

            return (
                <div>
                    <SectionHeader title="Décor" subtitle="Manage décor & styling portfolio" onAdd={() => { setEditItem({...empty}); setShowModal(true); }} addLabel="ADD DÉCOR" />
                    {(!data.decor || data.decor.length === 0) ? (
                        <EmptyState icon="fa-palette" text="No décor items added yet" />
                    ) : (
                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                            {data.decor.map((d, i) => (
                                <div key={i} className="bg-white rounded-xl border border-gray-100 overflow-hidden group relative">
                                    {d.img && <img src={d.img} className="w-full aspect-square object-cover" alt={d.name} />}
                                    <div className="p-3">
                                        <h3 className="font-bold text-xs">{d.name}</h3>
                                        <p className="text-gray-400 text-[10px]">{d.category}</p>
                                    </div>
                                    <div className="absolute top-2 right-2 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                        <button onClick={() => { setEditItem({...d, _index: i}); setShowModal(true); }} className="w-6 h-6 bg-white/90 rounded-full flex items-center justify-center shadow"><i className="fas fa-pen text-[9px] text-gray-600"></i></button>
                                        <button onClick={() => { onDelete('decor', i); toast('Décor deleted','success'); }} className="w-6 h-6 bg-white/90 rounded-full flex items-center justify-center shadow"><i className="fas fa-trash text-[9px] text-red-400"></i></button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                    {showModal && (
                        <Modal onClose={() => { setShowModal(false); setEditItem(null); }}>
                            <>{editItem?._index !== undefined ? 'Edit Décor' : 'Add Décor'}</>
                            <DecorForm item={editItem} onSave={handleSave} />
                        </Modal>
                    )}
                </div>
            );
        };

        const DecorForm = ({ item, onSave }) => {
            const [form, setForm] = useState(item || {});
            const set = (k, v) => setForm(p => ({...p, [k]: v}));
            return (
                <div className="space-y-4">
                    <FormField label="Décor Name *"><Input value={form.name||''} onChange={e=>set('name',e.target.value)} placeholder="e.g. Mandap Designs" /></FormField>
                    <FormField label="Category"><Select value={form.category||''} onChange={e=>set('category',e.target.value)} placeholder="Select category" options={['Mandap','Floral','Stage','Entrance','Reception','Lighting','Table','Ceiling','Haldi','Sangeet']} /></FormField>
                    <FormField label="Image" full>
                        <ImageUpload onUpload={url => set('img', url)} />
                        {form.img && <img src={form.img} className="mt-2 h-24 rounded-lg object-cover" alt="" />}
                    </FormField>
                    <div className="flex justify-end gap-2 pt-2">
                        <button onClick={() => onSave(form)} className="bg-gray-900 text-white px-6 py-2.5 rounded-lg text-xs font-semibold hover:bg-gold transition-all">SAVE DÉCOR</button>
                    </div>
                </div>
            );
        };

        // ─── GALLERY SECTION ──────────────────────────────────
        const GallerySection = ({ data, onSave, onDelete, toast }) => {
            const [showUpload, setShowUpload] = useState(false);

            return (
                <div>
                    <SectionHeader title="Gallery" subtitle="Manage gallery images" onAdd={() => setShowUpload(!showUpload)} addLabel={showUpload ? 'CLOSE' : 'ADD IMAGES'} />
                    {showUpload && (
                        <div className="bg-white rounded-xl border border-gray-100 p-5 mb-6">
                            <h3 className="font-bold text-sm mb-3">Upload Images</h3>
                            <ImageUpload multiple onUpload={url => onSave('gallery', { img: url, category: 'All' })} />
                        </div>
                    )}
                    {(!data.gallery || data.gallery.length === 0) ? (
                        <EmptyState icon="fa-images" text="No gallery images uploaded yet" />
                    ) : (
                        <div className="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
                            {data.gallery.map((g, i) => (
                                <div key={i} className="relative group rounded-xl overflow-hidden aspect-[3/4] bg-gray-100">
                                    <img src={g.img} className="w-full h-full object-cover" alt="" />
                                    <div className="absolute inset-0 bg-black/0 group-hover:bg-black/30 transition-all flex items-center justify-center">
                                        <button onClick={() => { onDelete('gallery', i); toast('Image deleted','success'); }}
                                            className="w-8 h-8 bg-red-500 text-white rounded-full text-xs opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                            <i className="fas fa-trash"></i>
                                        </button>
                                    </div>
                                    <span className="absolute bottom-1 left-1 bg-black/60 text-white text-[8px] px-1.5 py-0.5 rounded">{g.category}</span>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        // ─── TESTIMONIALS SECTION ─────────────────────────────
        const TestimonialsSection = ({ data, onSave, onDelete, toast }) => {
            const [editItem, setEditItem] = useState(null);
            const [showModal, setShowModal] = useState(false);
            const empty = { name: '', wedding: '', location: '', text: '', rating: '5', img: '' };

            const handleSave = (item) => {
                onSave('testimonials', item);
                setShowModal(false); setEditItem(null);
                toast('Testimonial saved', 'success');
            };

            return (
                <div>
                    <SectionHeader title="Testimonials" subtitle="Manage client reviews" onAdd={() => { setEditItem({...empty}); setShowModal(true); }} addLabel="ADD TESTIMONIAL" />
                    {(!data.testimonials || data.testimonials.length === 0) ? (
                        <EmptyState icon="fa-quote-right" text="No testimonials added yet" />
                    ) : (
                        <div className="space-y-3">
                            {data.testimonials.map((t, i) => (
                                <div key={i} className="bg-white rounded-xl border border-gray-100 p-4 flex items-start gap-4">
                                    {t.img && <img src={t.img} className="w-12 h-12 rounded-full object-cover shrink-0" alt="" />}
                                    <div className="flex-1 min-w-0">
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <h4 className="font-bold text-sm">{t.name}</h4>
                                                <p className="text-gold text-[10px]">{t.wedding} — {t.location}</p>
                                            </div>
                                            <div className="flex gap-1">
                                                <button onClick={() => { setEditItem({...t, _index: i}); setShowModal(true); }} className="w-7 h-7 rounded-lg bg-gray-100 flex items-center justify-center hover:bg-gold/10"><i className="fas fa-pen text-[10px] text-gray-500"></i></button>
                                                <button onClick={() => { onDelete('testimonials', i); toast('Deleted','success'); }} className="w-7 h-7 rounded-lg bg-gray-100 flex items-center justify-center hover:bg-red-50"><i className="fas fa-trash text-[10px] text-gray-400"></i></button>
                                            </div>
                                        </div>
                                        <p className="text-gray-500 text-xs mt-1.5 line-clamp-2 italic">"{t.text}"</p>
                                        <div className="flex text-gold mt-1.5">
                                            {[...Array(parseInt(t.rating)||5)].map((_, j) => <i key={j} className="fas fa-star text-[8px]"></i>)}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                    {showModal && (
                        <Modal onClose={() => { setShowModal(false); setEditItem(null); }}>
                            <>{editItem?._index !== undefined ? 'Edit Testimonial' : 'Add Testimonial'}</>
                            <TestimonialForm item={editItem} onSave={handleSave} />
                        </Modal>
                    )}
                </div>
            );
        };

        const TestimonialForm = ({ item, onSave }) => {
            const [form, setForm] = useState(item || {});
            const set = (k, v) => setForm(p => ({...p, [k]: v}));
            return (
                <div className="space-y-4">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <FormField label="Client Name *"><Input value={form.name||''} onChange={e=>set('name',e.target.value)} placeholder="e.g. Priya & Arjun" /></FormField>
                        <FormField label="Wedding/Event"><Input value={form.wedding||''} onChange={e=>set('wedding',e.target.value)} placeholder="e.g. Grand Wedding" /></FormField>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <FormField label="Location"><Input value={form.location||''} onChange={e=>set('location',e.target.value)} placeholder="e.g. The Leela, Mumbai" /></FormField>
                        <FormField label="Rating"><Select value={form.rating||'5'} onChange={e=>set('rating',e.target.value)} options={['5','4','3','2','1']} /></FormField>
                    </div>
                    <FormField label="Review Text *" full><Textarea value={form.text||''} onChange={e=>set('text',e.target.value)} placeholder="Client's review..." rows={4} /></FormField>
                    <FormField label="Client Photo" full>
                        <ImageUpload onUpload={url => set('img', url)} />
                        {form.img && <img src={form.img} className="mt-2 h-16 w-16 rounded-full object-cover" alt="" />}
                    </FormField>
                    <div className="flex justify-end gap-2 pt-2">
                        <button onClick={() => onSave(form)} className="bg-gray-900 text-white px-6 py-2.5 rounded-lg text-xs font-semibold hover:bg-gold transition-all">SAVE TESTIMONIAL</button>
                    </div>
                </div>
            );
        };

        // ─── STATS SECTION ────────────────────────────────────
        const StatsSection = ({ data, onSave, toast }) => {
            const [stats, setStats] = useState(data.stats || { years: '', weddings: '', venues: '', cities: '' });
            const set = (k, v) => setStats(p => ({...p, [k]: v}));

            return (
                <div>
                    <SectionHeader title="Stats & Numbers" subtitle="Manage credibility statistics" />
                    <div className="bg-white rounded-xl border border-gray-100 p-6">
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                            <FormField label="Years of Experience"><Input value={stats.years||''} onChange={e=>set('years',e.target.value)} placeholder="e.g. 6+" /></FormField>
                            <FormField label="Weddings Executed"><Input value={stats.weddings||''} onChange={e=>set('weddings',e.target.value)} placeholder="e.g. 100+" /></FormField>
                            <FormField label="Premium Venues"><Input value={stats.venues||''} onChange={e=>set('venues',e.target.value)} placeholder="e.g. 30+" /></FormField>
                            <FormField label="Cities & Destinations"><Input value={stats.cities||''} onChange={e=>set('cities',e.target.value)} placeholder="e.g. 10+" /></FormField>
                        </div>
                        <button onClick={() => { onSave('stats', stats); toast('Stats updated','success'); }}
                            className="bg-gray-900 text-white px-6 py-2.5 rounded-lg text-xs font-semibold hover:bg-gold transition-all">
                            SAVE STATS
                        </button>
                    </div>
                </div>
            );
        };

        // ─── ABOUT SECTION ────────────────────────────────────
        const AboutSection = ({ data, onSave, toast }) => {
            const [about, setAbout] = useState(data.about || { title: '', description: '', founderName: '', founderTitle: '', founderBio: '', founderImg: '' });
            const set = (k, v) => setAbout(p => ({...p, [k]: v}));

            return (
                <div>
                    <SectionHeader title="About & Founder" subtitle="Manage company info and founder section" />
                    <div className="bg-white rounded-xl border border-gray-100 p-6 space-y-4">
                        <FormField label="About Title"><Input value={about.title||''} onChange={e=>set('title',e.target.value)} placeholder="e.g. The People Behind the Celebrations" /></FormField>
                        <FormField label="About Description" full><Textarea value={about.description||''} onChange={e=>set('description',e.target.value)} placeholder="Company description..." rows={4} /></FormField>
                        <hr className="border-gray-100" />
                        <h4 className="font-bold text-sm text-gray-700">Founder / Leadership</h4>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <FormField label="Founder Name"><Input value={about.founderName||''} onChange={e=>set('founderName',e.target.value)} placeholder="e.g. Rajesh Kumar" /></FormField>
                            <FormField label="Designation"><Input value={about.founderTitle||''} onChange={e=>set('founderTitle',e.target.value)} placeholder="e.g. Founder & Director" /></FormField>
                        </div>
                        <FormField label="Bio"><Textarea value={about.founderBio||''} onChange={e=>set('founderBio',e.target.value)} placeholder="Short professional bio..." rows={3} /></FormField>
                        <FormField label="Founder Photo" full>
                            <ImageUpload onUpload={url => set('founderImg', url)} />
                            {about.founderImg && <img src={about.founderImg} className="mt-2 h-20 w-20 rounded-full object-cover" alt="" />}
                        </FormField>
                        <button onClick={() => { onSave('about', about); toast('About section updated','success'); }}
                            className="bg-gray-900 text-white px-6 py-2.5 rounded-lg text-xs font-semibold hover:bg-gold transition-all">
                            SAVE ABOUT
                        </button>
                    </div>
                </div>
            );
        };

        // ─── LOCATIONS SECTION ────────────────────────────────
        const LocationsSection = ({ data, onSave, toast }) => {
            const [locations, setLocations] = useState(data.locations || []);
            const [newLoc, setNewLoc] = useState('');

            const addLocation = () => {
                if (newLoc.trim()) {
                    const updated = [...locations, newLoc.trim()];
                    setLocations(updated);
                    onSave('locations', updated);
                    setNewLoc('');
                    toast('Location added','success');
                }
            };
            const removeLocation = (i) => {
                const updated = locations.filter((_,idx) => idx !== i);
                setLocations(updated);
                onSave('locations', updated);
                toast('Location removed','success');
            };

            return (
                <div>
                    <SectionHeader title="Locations" subtitle="Manage operating locations" />
                    <div className="bg-white rounded-xl border border-gray-100 p-6">
                        <div className="flex gap-2 mb-4">
                            <Input value={newLoc} onChange={e => setNewLoc(e.target.value)} placeholder="Add a location..." />
                            <button onClick={addLocation} className="bg-gray-900 text-white px-4 py-2.5 rounded-lg text-xs font-semibold hover:bg-gold transition-all shrink-0">
                                <i className="fas fa-plus text-[10px]"></i>
                            </button>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            {locations.map((loc, i) => (
                                <span key={i} className="bg-gray-100 text-gray-700 text-xs px-3 py-1.5 rounded-full flex items-center gap-2">
                                    {loc}
                                    <button onClick={() => removeLocation(i)} className="text-gray-400 hover:text-red-500"><i className="fas fa-times text-[10px]"></i></button>
                                </span>
                            ))}
                        </div>
                        {locations.length === 0 && <p className="text-gray-400 text-xs">No locations added yet</p>}
                    </div>
                </div>
            );
        };

        // ─── MAIN APP ─────────────────────────────────────────
        const App = () => {
            const [loggedIn, setLoggedIn] = useState(false);
            const [activeSection, setActiveSection] = useState('dashboard');
            const [data, setData] = useState({ weddings: [], venues: [], decor: [], gallery: [], testimonials: [], stats: {}, about: {}, locations: [] });
            const [toastMsg, setToastMsg] = useState(null);
            const [sidebarOpen, setSidebarOpen] = useState(false);

            // Load data from Firestore
            useEffect(() => {
                if (!loggedIn) return;
                const unsubscribe = db.collection('siteData').doc('main').onSnapshot((doc) => {
                    if (doc.exists) {
                        const val = doc.data();
                        setData({
                            weddings: val.weddings || [],
                            venues: val.venues || [],
                            decor: val.decor || [],
                            gallery: val.gallery || [],
                            testimonials: val.testimonials || [],
                            stats: val.stats || {},
                            about: val.about || {},
                            locations: val.locations || []
                        });
                    }
                }, (err) => { console.error('Firestore read error:', err); });
                return () => unsubscribe();
            }, [loggedIn]);

            const toast = (msg, type = 'success') => {
                setToastMsg({ msg, type });
                setTimeout(() => setToastMsg(null), 3000);
            };

            // Save a single item (add or update) to Firestore
            const handleSave = async (section, item) => {
                try {
                    const docRef = db.collection('siteData').doc('main');
                    if (item._index !== undefined) {
                        const arr = [...(data[section] || [])];
                        const idx = item._index;
                        delete item._index;
                        arr[idx] = item;
                        await docRef.update({ [section]: arr });
                    } else {
                        const arr = [...(data[section] || [])];
                        arr.push(item);
                        await docRef.update({ [section]: arr });
                    }
                } catch (err) {
                    console.error('Save error:', err);
                    // If doc doesn't exist, create it
                    try {
                        const arr = [...(data[section] || [])];
                        if (item._index === undefined) arr.push(item);
                        await db.collection('siteData').doc('main').set({ [section]: arr });
                    } catch (err2) {
                        toast('Save failed: ' + err2.message, 'error');
                        return;
                    }
                }
                toast('Saved successfully', 'success');
            };

            // For stats/about/locations (non-array)
            const handleSaveDirect = async (section, value) => {
                try {
                    await db.collection('siteData').doc('main').update({ [section]: value });
                } catch (err) {
                    try {
                        await db.collection('siteData').doc('main').set({ [section]: value }, { merge: true });
                    } catch (err2) {
                        toast('Save failed: ' + err2.message, 'error');
                        return;
                    }
                }
                toast('Saved successfully', 'success');
            };

            // Delete item from array
            const handleDelete = async (section, index) => {
                try {
                    const arr = [...(data[section] || [])];
                    arr.splice(index, 1);
                    await db.collection('siteData').doc('main').update({ [section]: arr });
                } catch (err) {
                    console.error('Delete error:', err);
                    toast('Delete failed: ' + err.message, 'error');
                }
            };

            const handleLogout = () => { setLoggedIn(false); setActiveSection('dashboard'); };

            if (!loggedIn) return <Login onLogin={() => setLoggedIn(true)} />;

            const sidebarItems = [
                { id: 'dashboard', icon: 'fa-th-large', label: 'Dashboard' },
                { id: 'weddings', icon: 'fa-heart', label: 'Weddings' },
                { id: 'venues', icon: 'fa-hotel', label: 'Venues' },
                { id: 'decor', icon: 'fa-palette', label: 'Décor' },
                { id: 'gallery', icon: 'fa-images', label: 'Gallery' },
                { id: 'testimonials', icon: 'fa-quote-right', label: 'Testimonials' },
                { id: 'stats', icon: 'fa-chart-bar', label: 'Stats' },
                { id: 'about', icon: 'fa-info-circle', label: 'About' },
                { id: 'locations', icon: 'fa-map-marker-alt', label: 'Locations' },
            ];

            const closeSidebar = () => setSidebarOpen(false);
            const navigateTo = (id) => { setActiveSection(id); setSidebarOpen(false); };

            return (
                <div className="min-h-screen flex">
                    {toastMsg && <Toast message={toastMsg.msg} type={toastMsg.type} />}

                    {/* Mobile Overlay */}
                    {sidebarOpen && <div className="fixed inset-0 bg-black/30 z-40 lg:hidden" onClick={closeSidebar}></div>}

                    {/* Sidebar */}
                    <aside className={`fixed top-0 left-0 h-full z-50 flex flex-col bg-white border-r border-gray-100 transition-transform duration-300 ${
                        sidebarOpen ? 'translate-x-0' : '-translate-x-full'
                    } lg:translate-x-0 lg:static lg:w-56 w-64`}>
                        <div className="p-4 border-b border-gray-100 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <img src="logo.png" alt="Sky Events" className="h-8 w-auto rounded-lg" />
                                <div>
                                    <p className="text-[10px] text-gray-400 tracking-wider">ADMIN PANEL</p>
                                </div>
                            </div>
                            <button onClick={closeSidebar} className="lg:hidden w-7 h-7 rounded-lg bg-gray-100 flex items-center justify-center">
                                <i className="fas fa-times text-gray-500 text-[10px]"></i>
                            </button>
                        </div>
                        <nav className="flex-1 py-3 overflow-y-auto">
                            {sidebarItems.map(item => (
                                <button key={item.id} onClick={() => navigateTo(item.id)}
                                    className={`sidebar-item w-full flex items-center gap-3 px-4 py-2.5 text-xs font-medium transition-all ${
                                        activeSection === item.id ? 'active' : 'text-gray-500'
                                    }`}>
                                    <i className={`fas ${item.icon} w-4 text-center text-[11px]`}></i>
                                    {item.label}
                                </button>
                            ))}
                        </nav>
                        <div className="p-3 border-t border-gray-100">
                            <a href="index.html" target="_blank" className="flex items-center gap-2 px-3 py-2 text-[11px] text-gray-400 hover:text-gold transition-colors rounded-lg hover:bg-gray-50 mb-1">
                                <i className="fas fa-external-link-alt text-[9px]"></i> View Website
                            </a>
                            <button onClick={handleLogout} className="flex items-center gap-2 px-3 py-2 text-[11px] text-gray-400 hover:text-red-500 transition-colors rounded-lg hover:bg-gray-50 w-full">
                                <i className="fas fa-sign-out-alt text-[9px]"></i> Sign Out
                            </button>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 min-h-screen">
                        {/* Mobile Top Bar */}
                        <div className="lg:hidden sticky top-0 z-30 bg-white border-b border-gray-100 px-4 py-3 flex items-center gap-3">
                            <button onClick={() => setSidebarOpen(true)} className="w-9 h-9 rounded-lg bg-gray-100 flex items-center justify-center">
                                <i className="fas fa-bars text-gray-600 text-sm"></i>
                            </button>
                            <img src="logo.png" alt="Sky Events" className="h-7 w-auto rounded" />
                            <span className="text-xs font-bold text-gray-700">Admin</span>
                        </div>
                        <div className="p-5 md:p-8">
                        {activeSection === 'dashboard' && <Dashboard data={data} />}
                        {activeSection === 'weddings' && <WeddingsSection data={data} onSave={handleSave} onDelete={handleDelete} toast={toast} />}
                        {activeSection === 'venues' && <VenuesSection data={data} onSave={handleSave} onDelete={handleDelete} toast={toast} />}
                        {activeSection === 'decor' && <DecorSection data={data} onSave={handleSave} onDelete={handleDelete} toast={toast} />}
                        {activeSection === 'gallery' && <GallerySection data={data} onSave={handleSave} onDelete={handleDelete} toast={toast} />}
                        {activeSection === 'testimonials' && <TestimonialsSection data={data} onSave={handleSave} onDelete={handleDelete} toast={toast} />}
                        {activeSection === 'stats' && <StatsSection data={data} onSave={handleSaveDirect} toast={toast} />}
                        {activeSection === 'about' && <AboutSection data={data} onSave={handleSaveDirect} toast={toast} />}
                        {activeSection === 'locations' && <LocationsSection data={data} onSave={handleSaveDirect} toast={toast} />}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
