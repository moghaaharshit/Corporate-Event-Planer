<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Events | A Division of Kad Events Pvt Ltd</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --gold: #D4AF37;
            --dark: #0a0a0a;
            --darker: #050505;
        }
        
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark);
            color: white;
            overflow-x: hidden;
        }
        
        .font-playfair {
            font-family: 'Playfair Display', serif;
        }
        
        .bg-gold { background-color: var(--gold); }
        .text-gold { color: var(--gold); }
        .border-gold { border-color: var(--gold); }
        .hover-gold:hover { background-color: var(--gold); color: var(--dark); }
        .hover-text-gold:hover { color: var(--gold); }
        
        /* Animations */
        .fade-in-up {
            opacity: 0;
            transform: translateY(40px);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .fade-in-up.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .scale-in {
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .scale-in.visible {
            opacity: 1;
            transform: scale(1);
        }
        
        .slide-in-left {
            opacity: 0;
            transform: translateX(-60px);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .slide-in-left.visible {
            opacity: 1;
            transform: translateX(0);
        }
        
        .slide-in-right {
            opacity: 0;
            transform: translateX(60px);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .slide-in-right.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .hero-gradient {
            background: linear-gradient(135deg, rgba(5,5,5,0.9) 0%, rgba(10,10,10,0.4) 100%);
        }
        
        .service-card {
            background: linear-gradient(145deg, #111 0%, #1a1a1a 100%);
            border: 1px solid #222;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .service-card:hover {
            border-color: var(--gold);
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.15);
        }
        
        .stat-item {
            border-left: 1px solid #333;
        }
        
        .stat-item:first-child {
            border-left: none;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--darker);
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--gold);
        }

        .sticky-nav {
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        }

        .side-contact {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#D4AF37',
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Intersection Observer Hook
        const useInView = (threshold = 0.1) => {
            const ref = useRef(null);
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                        }
                    },
                    { threshold }
                );
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, [threshold]);

            return [ref, isVisible];
        };

        const PageBanner = ({ title, subtitle }) => {
            const [ref, isVisible] = useInView();
            return (
                <section className="relative h-64 md:h-80 flex items-center justify-center bg-[#0f111a] border-b border-gray-800" ref={ref}>
                    <div className="absolute inset-0 z-0">
                        <img src="https://images.unsplash.com/photo-1540575467063-178a50c2df87?auto=format&fit=crop&q=80&w=2000" alt="Banner" className="w-full h-full object-cover opacity-20" />
                        <div className="absolute inset-0 bg-gradient-to-t from-[#0a0a0a] via-transparent to-[#0a0a0a]"></div>
                    </div>
                    <div className="relative z-10 text-center">
                        <p className={`text-gold tracking-widest text-sm mb-2 uppercase fade-in-up ${isVisible ? 'visible' : ''}`}>Sky Events</p>
                        <h1 className={`text-4xl md:text-6xl font-playfair mb-2 fade-in-up ${isVisible ? 'visible' : ''}`} style={{transitionDelay: '0.2s'}}>{title}</h1>
                        <p className={`text-gray-400 text-sm md:text-base fade-in-up ${isVisible ? 'visible' : ''}`} style={{transitionDelay: '0.4s'}}>{subtitle}</p>
                    </div>
                </section>
            );
        };

        const Contact = () => {
            const [ref, isVisible] = useInView();
            return (
                <section className="py-16 md:py-24 bg-[#0a0a0a]" ref={ref}>
                    <div className="container mx-auto px-4 md:px-6 lg:px-12">
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-12">
                            <div className={`bg-[#111] p-8 md:p-12 rounded-2xl border border-[#222] fade-in-up ${isVisible ? 'visible' : ''}`}>
                                <h3 className="text-2xl font-playfair mb-6">Send us a Message</h3>
                                <form className="space-y-6">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <input type="text" placeholder="Your Name" className="w-full bg-[#1a1a1a] border border-[#333] rounded-lg px-4 py-3 focus:border-gold focus:outline-none transition-colors text-sm" />
                                        <input type="email" placeholder="Email Address" className="w-full bg-[#1a1a1a] border border-[#333] rounded-lg px-4 py-3 focus:border-gold focus:outline-none transition-colors text-sm" />
                                    </div>
                                    <input type="text" placeholder="Subject" className="w-full bg-[#1a1a1a] border border-[#333] rounded-lg px-4 py-3 focus:border-gold focus:outline-none transition-colors text-sm" />
                                    <textarea rows="4" placeholder="Your Message" className="w-full bg-[#1a1a1a] border border-[#333] rounded-lg px-4 py-3 focus:border-gold focus:outline-none transition-colors resize-none text-sm"></textarea>
                                    <button className="bg-gold text-black px-8 py-3 rounded-lg font-bold hover:bg-yellow-400 transition-all w-full sm:w-auto">
                                        SEND MESSAGE <i className="fas fa-paper-plane ml-2"></i>
                                    </button>
                                </form>
                            </div>
                            <div className={`space-y-8 slide-in-right ${isVisible ? 'visible' : ''}`}>
                                <div className="flex items-start gap-4">
                                    <div className="bg-gold/10 p-4 rounded-full">
                                        <i className="fas fa-map-marker-alt text-gold text-xl"></i>
                                    </div>
                                    <div>
                                        <h4 className="font-bold mb-1">Office Address</h4>
                                        <p className="text-gray-400 text-sm">123, Business Park, Bandra Kurla Complex, Mumbai - 400051</p>
                                    </div>
                                </div>
                                <div className="flex items-start gap-4">
                                    <div className="bg-gold/10 p-4 rounded-full">
                                        <i className="fas fa-phone-alt text-gold text-xl"></i>
                                    </div>
                                    <div>
                                        <h4 className="font-bold mb-1">Call Us</h4>
                                        <p className="text-gray-400 text-sm">+91 98765 43210</p>
                                    </div>
                                </div>
                                <div className="flex items-start gap-4">
                                    <div className="bg-gold/10 p-4 rounded-full">
                                        <i className="fas fa-envelope text-gold text-xl"></i>
                                    </div>
                                    <div>
                                        <h4 className="font-bold mb-1">Email Us</h4>
                                        <p className="text-gray-400 text-sm">hello@skyevents.com</p>
                                    </div>
                                </div>
                                <div className="pt-6">
                                    <h4 className="font-bold mb-4">Follow Us</h4>
                                    <div className="flex gap-4">
                                        <a href="#" className="w-10 h-10 rounded-full bg-[#111] border border-gray-800 flex items-center justify-center hover:bg-gold hover:border-gold transition-all"><i className="fab fa-facebook-f"></i></a>
                                        <a href="#" className="w-10 h-10 rounded-full bg-[#111] border border-gray-800 flex items-center justify-center hover:bg-gold hover:border-gold transition-all"><i className="fab fa-instagram"></i></a>
                                        <a href="#" className="w-10 h-10 rounded-full bg-[#111] border border-gray-800 flex items-center justify-center hover:bg-gold hover:border-gold transition-all"><i className="fab fa-linkedin-in"></i></a>
                                        <a href="#" className="w-10 h-10 rounded-full bg-[#111] border border-gray-800 flex items-center justify-center hover:bg-gold hover:border-gold transition-all"><i className="fab fa-twitter"></i></a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`fixed w-full z-50 transition-all duration-300 ${scrolled ? 'sticky-nav py-3' : 'py-4 md:py-6'}`}>
                    <div className="container mx-auto px-4 md:px-6 lg:px-12 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <a href="#home"><img src="logo.png" alt="Sky Events Logo" className="h-10 md:h-12 w-auto rounded-lg border border-gold/50 object-contain shadow-lg shadow-gold/10" /></a>
                        </div>
                        <div className="hidden lg:flex items-center space-x-6 xl:space-x-8 text-sm font-medium">

                            <a href="#contact" className="hover-text-gold transition-colors">CONTACT</a>
                            <a href="#contact" className="bg-gold text-black px-6 py-3 rounded font-semibold hover:bg-yellow-400 transition-all flex items-center gap-2">

                            </a>
                        </div>
                        <div className="lg:hidden">
                            <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="text-white focus:outline-none">
                                <i className={`fas ${mobileMenuOpen ? 'fa-times' : 'fa-bars'} text-2xl`}></i>
                            </button>
                        </div>
                    </div>
                    {mobileMenuOpen && (
                        <div className="lg:hidden bg-[#111] border-t border-gray-800 px-6 py-8 animate-fade-in-down">
                            <div className="flex flex-col space-y-5 text-sm font-medium">
                                <a href="#home" onClick={() => setMobileMenuOpen(false)} className="text-gold border-b border-gold pb-1 w-max">HOME</a>
                                <a href="#about" onClick={() => setMobileMenuOpen(false)} className="hover-text-gold transition-colors">ABOUT US</a>
                                <a href="#services" onClick={() => setMobileMenuOpen(false)} className="hover-text-gold transition-colors">SERVICES</a>
                                <a href="#events" onClick={() => setMobileMenuOpen(false)} className="hover-text-gold transition-colors">EVENTS</a>
                                <a href="#gallery" onClick={() => setMobileMenuOpen(false)} className="hover-text-gold transition-colors">GALLERY</a>
                                <a href="#clients" onClick={() => setMobileMenuOpen(false)} className="hover-text-gold transition-colors">CLIENTS</a>
                                <a href="#blog" onClick={() => setMobileMenuOpen(false)} className="hover-text-gold transition-colors">BLOG</a>
                                <a href="#contact" onClick={() => setMobileMenuOpen(false)} className="hover-text-gold transition-colors">CONTACT</a>
                                <a href="#contact" onClick={() => setMobileMenuOpen(false)} className="bg-gold text-black px-6 py-3 rounded font-semibold hover:bg-yellow-400 transition-all flex items-center gap-2 w-max mt-2">
                                    PLAN YOUR EVENT <i className="fas fa-arrow-right text-xs"></i>
                                </a>
                            </div>
                        </div>
                    )}
                </nav>
            );
        };

        const Hero = () => {
            const [ref, isVisible] = useInView();
            
            return (
                <section className="relative min-h-[90vh] md:min-h-screen flex items-center pt-20 pb-8 md:pb-0" ref={ref}>
                    <div className="absolute inset-0 z-0">
                        <img src="https://images.unsplash.com/photo-1540575467063-178a50c2df87?auto=format&fit=crop&q=80&w=2000" alt="Event Background" className="w-full h-full object-cover" />
                        <div className="absolute inset-0 bg-gradient-to-r from-black/90 via-black/80 to-transparent"></div>
                        <div className="absolute inset-0 bg-gradient-to-t from-[#0a0a0a] via-[#0a0a0a]/40 to-transparent"></div>
                    </div>

                    <div className="container mx-auto px-5 md:px-6 lg:px-12 relative z-10">
                        <div className="max-w-4xl">
                            <div className={`inline-block bg-gold/10 border border-gold/30 rounded-full px-4 py-1.5 mb-4 md:mb-6 fade-in-up ${isVisible ? 'visible' : ''}`}>
                                <p className="text-gold tracking-[0.15em] text-[10px] md:text-sm font-medium">

                                </p>
                            </div>
                            
                            <h1 className={`text-[2rem] sm:text-5xl md:text-8xl lg:text-[5.5rem] font-playfair mb-4 md:mb-8 leading-[1.05] fade-in-up ${isVisible ? 'visible' : ''}`} style={{transitionDelay: '0.2s'}}>
                                Extraordinary<br className="sm:hidden" /> Events.<br />
                                <span className="italic text-gold">Exceptional<br className="sm:hidden" /> Experiences.</span>
                            </h1>
                            
                            <p className={`text-gray-300 text-sm md:text-xl mb-6 md:mb-12 max-w-xl leading-relaxed fade-in-up ${isVisible ? 'visible' : ''}`} style={{transitionDelay: '0.4s'}}>
                                From corporate meetings to grand celebrations, we design and deliver events that inspire, engage and leave a lasting impact.
                            </p>
                            
                            <div className={`flex flex-col sm:flex-row gap-3 md:gap-4 mb-8 md:mb-16 fade-in-up ${isVisible ? 'visible' : ''}`} style={{transitionDelay: '0.6s'}}>
                                <button className="bg-gold text-black px-6 py-3.5 md:px-8 md:py-4 rounded-lg font-bold hover:bg-yellow-400 transition-all flex items-center justify-center gap-2 shadow-lg shadow-gold/20 text-sm md:text-base">
                                    PLAN YOUR EVENT <i className="fas fa-arrow-right"></i>
                                </button>
                                <button className="border border-gray-500/50 bg-white/5 backdrop-blur-sm px-6 py-3.5 md:px-8 md:py-4 rounded-lg font-bold hover:border-gold hover:text-gold transition-all flex items-center justify-center gap-2 text-sm md:text-base">
                                    EXPLORE EVENTS <i className="fas fa-arrow-right"></i>
                                </button>
                            </div>
                            
                            <div className={`grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-6 border-t border-white/10 pt-5 md:pt-8 fade-in-up ${isVisible ? 'visible' : ''}`} style={{transitionDelay: '0.8s'}}>
                                <div className="flex items-center gap-2">
                                    <div className="bg-gold/10 p-1.5 md:p-2 rounded-lg">
                                        <i className="fas fa-tools text-gold text-xs md:text-base"></i>
                                    </div>
                                    <div>
                                        <h4 className="font-semibold text-[10px] md:text-sm leading-tight">Tailored Solutions</h4>
                                        <p className="text-gray-400 text-[8px] md:text-xs">Customized for your brand</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="bg-gold/10 p-1.5 md:p-2 rounded-lg">
                                        <i className="fas fa-check-circle text-gold text-xs md:text-base"></i>
                                    </div>
                                    <div>
                                        <h4 className="font-semibold text-[10px] md:text-sm leading-tight">Flawless Execution</h4>
                                        <p className="text-gray-400 text-[8px] md:text-xs">From start to perfection</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="bg-gold/10 p-1.5 md:p-2 rounded-lg">
                                        <i className="fas fa-lightbulb text-gold text-xs md:text-base"></i>
                                    </div>
                                    <div>
                                        <h4 className="font-semibold text-[10px] md:text-sm leading-tight">Creative & Innovative</h4>
                                        <p className="text-gray-400 text-[8px] md:text-xs">Unique ideas, unforgettable events</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="bg-gold/10 p-1.5 md:p-2 rounded-lg">
                                        <i className="fas fa-gem text-gold text-xs md:text-base"></i>
                                    </div>
                                    <div>
                                        <h4 className="font-semibold text-[10px] md:text-sm leading-tight">Memorable Experiences</h4>
                                        <p className="text-gray-400 text-[8px] md:text-xs">We create moments that last</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Social Sidebar - Compact Mobile */}
                    <div className="fixed left-2 md:left-6 bottom-20 md:bottom-32 z-40 hidden md:flex flex-col gap-3 md:gap-4">
                        <a href="#" className="w-10 h-10 border border-gray-600 rounded-full flex items-center justify-center hover:bg-gold hover:border-gold transition-all text-sm bg-black/50 backdrop-blur-sm">in</a>
                        <a href="#" className="w-10 h-10 border border-gray-600 rounded-full flex items-center justify-center hover:bg-gold hover:border-gold transition-all bg-black/50 backdrop-blur-sm"><i className="fab fa-instagram text-sm"></i></a>
                        <a href="#" className="w-10 h-10 border border-gray-600 rounded-full flex items-center justify-center hover:bg-gold hover:border-gold transition-all bg-black/50 backdrop-blur-sm"><i className="fab fa-youtube text-sm"></i></a>
                    </div>

                    {/* Scroll Indicator - Mobile Only */}

                        <span className="text-[9px] text-gray-400 tracking-widest">SCROLL</span>
                        <div className="w-[1px] h-8 bg-gradient-to-b from-gold to-transparent animate-pulse"></div>
                    </div>
                </section>
            );
        };

        const Stats = () => {
            const [ref, isVisible] = useInView();
            const stats = [
                { icon: 'fa-calendar-check', value: '500+', label: 'Events Organized' },
                { icon: 'fa-users', value: '250+', label: 'Happy Clients' },
                { icon: 'fa-map-marker-alt', value: '20+', label: 'Cities Covered' },
                { icon: 'fa-star', value: '98%', label: 'Client Satisfaction' }
            ];

            return (
                <div className={`bg-[#111] py-6 md:py-8 border-y border-gray-800 -mt-1 relative z-20`} ref={ref}>
                    <div className="container mx-auto px-4 md:px-6 lg:px-12">

                            {stats.map((stat, index) => (

        const Services = () => {
            const [ref, isVisible] = useInView();
            const services = [
                { icon: 'fa-users', title: 'Conferences & Seminars', desc: 'Informative sessions that inspire and engage.' },
                { icon: 'fa-rocket', title: 'Product Launches', desc: 'Go-to-market launches that create buzz.' },
                { icon: 'fa-trophy', title: 'Award Functions', desc: 'Celebrate achievements with elegance.' },
                { icon: 'fa-champagne-glasses', title: 'Corporate Parties', desc: 'Unforgettable parties that bring teams together.' },
                { icon: 'fa-people-arrows', title: 'Team Building Activities', desc: 'Stronger teams through engaging experiences.' },
                { icon: 'fa-store', title: 'Exhibitions & Trade Shows', desc: 'Showcase your brand to the right audience.' },
                { icon: 'fa-calendar-days', title: 'Annual Meetings', desc: 'Productive meetings that drive results.' },
                { icon: 'fa-handshake', title: 'Dealer & Channel Meets', desc: 'Strengthen partnerships and grow together.' },
                { icon: 'fa-network-wired', title: 'Networking Events', desc: 'Connect, collaborate and create opportunities.' },
                { icon: 'fa-video', title: 'Virtual & Hybrid Events', desc: 'Engaging digital experiences that work seamlessly.' }
            ];

            return (
                <section className="py-16 md:py-24 bg-[#0a0a0a]" ref={ref}>
                    <div className="container mx-auto px-4 md:px-6 lg:px-12">
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-10 md:gap-16">
                            <div className={`slide-in-left ${isVisible ? 'visible' : ''} mb-8 lg:mb-0`}>
                                <p className="text-gray-400 tracking-widest text-xs md:text-sm mb-2">WHAT WE DO</p>
                                <h2 className="text-3xl md:text-5xl font-playfair mb-4 md:mb-6">
                                    Corporate Event <br />
                                    <span className="italic text-gold">Solutions</span>
                                </h2>
                                <p className="text-gray-400 mb-6 md:mb-8 leading-relaxed max-w-sm text-sm md:text-base">
                                    End-to-end event management services tailored to your brand, goals and audience.
                                </p>
                                <button className="bg-transparent border-2 border-gold text-gold px-6 py-2.5 md:px-8 md:py-3 font-semibold hover:bg-gold hover:text-black transition-all flex items-center gap-2 text-sm">
                                    VIEW ALL SERVICES <i className="fas fa-arrow-right text-xs"></i>
