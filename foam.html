<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Events | Wedding Enquiry</title>
    <meta name="description" content="Plan your luxury wedding with Sky Events. Enquire now for venue selection, décor, hospitality and complete wedding execution.">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --ivory: #F5F0E8;
            --cream: #FAF7F2;
            --warm-dark: #1A1714;
            --warm-darker: #0F0E0C;
            --gold: #C9A96E;
            --gold-light: #D4B87A;
            --text-primary: #1A1714;
            --text-secondary: #6B6560;
            --text-light: #9B9590;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--cream);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
            font-weight: 400;
        }

        .text-secondary { font-weight: 500; }
        .text-light { font-weight: 400; }

        .font-display {
            font-family: 'Cormorant Garamond', serif;
        }

        /* Animations */
        .fade-up {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .fade-up.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Radio Card */
        .radio-card {
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1.5px solid #E5E0D8;
        }
        .radio-card:hover {
            border-color: var(--gold);
            background-color: rgba(201, 169, 110, 0.04);
        }
        .radio-card.selected {
            border-color: var(--gold);
            background-color: rgba(201, 169, 110, 0.08);
        }
        .radio-card.selected .radio-dot {
            border-color: var(--gold);
        }
        .radio-card.selected .radio-dot::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: var(--gold);
            border-radius: 50%;
        }

        .radio-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1.5px solid #D1CCC5;
            position: relative;
            flex-shrink: 0;
            transition: border-color 0.3s ease;
        }

        /* Input */
        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #E5E0D8;
            border-radius: 10px;
            background: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: var(--text-primary);
            transition: border-color 0.3s ease;
            outline: none;
        }
        .form-input:focus {
            border-color: var(--gold);
        }
        .form-input::placeholder {
            color: var(--text-light);
        }

        /* Progress Bar */
        .progress-step {
            transition: all 0.4s ease;
        }
        .progress-step.active {
            background-color: var(--gold);
        }
        .progress-step.done {
            background-color: var(--gold);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--cream); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ivory: '#F5F0E8',
                        cream: '#FAF7F2',
                        gold: '#C9A96E',
                        'gold-light': '#D4B87A',
                        'warm-dark': '#1A1714',
                        'warm-darker': '#0F0E0C',
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const useInView = (threshold = 0.1) => {
            const ref = useRef(null);
            const [isVisible, setIsVisible] = useState(false);
            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => { if (entry.isIntersecting) setIsVisible(true); },
                    { threshold }
                );
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, [threshold]);
            return [ref, isVisible];
        };

        // ─── RADIO CARD COMPONENT ──────────────────────────────
        const RadioCard = ({ label, selected, onClick }) => (
            <div onClick={onClick}
                 className={`radio-card rounded-xl px-5 py-4 flex items-center gap-4 ${selected ? 'selected' : ''}`}>
                <div className="radio-dot"></div>
                <span className="text-sm font-medium">{label}</span>
            </div>
        );

        // ─── HEADER ────────────────────────────────────────────
        const Header = () => (
            <header className="bg-white border-b border-gray-100 py-4 px-5 md:px-8">
                <div className="max-w-3xl mx-auto flex justify-between items-center">
                    <a href="index.html" className="flex items-center gap-2">
                        <img src="logo.png" alt="Sky Events" className="h-9 w-auto rounded-lg" />
                    </a>
                    <a href="index.html" className="text-secondary text-xs tracking-wider font-medium hover:text-gold transition-colors">
                        <i className="fas fa-arrow-left mr-1.5 text-[10px]"></i> BACK TO WEBSITE
                    </a>
                </div>
            </header>
        );

        // ─── ENQUIRY FORM ─────────────────────────────────────
        const EnquiryForm = () => {
            const [ref, isVisible] = useInView();
            const [step, setStep] = useState(0);
            const [formData, setFormData] = useState({
                name: '',
                phone: '',
                location: '',
                timeline: '',
                weddingType: '',
                budget: ''
            });
            const [submitted, setSubmitted] = useState(false);

            const steps = [
                {
                    num: '01',
                    question: "Let's start with your name.",
                    subtitle: "What should we call you?",
                    type: 'text',
                    field: 'name',
                    placeholder: 'Your full name'
                },
                {
                    num: '02',
                    question: "Where can our wedding team reach you?",
                    subtitle: "WhatsApp or contact number.",
                    type: 'tel',
                    field: 'phone',
                    placeholder: '+91 98765 43210'
                },
                {
                    num: '03',
                    question: "Where are you planning your wedding?",
                    subtitle: "Choose your preferred location.",
                    type: 'radio',
                    field: 'location',
                    options: ['Navi Mumbai', 'Mumbai', 'Karjat', 'Lonavala', 'Other Destination']
                },
                {
                    num: '04',
                    question: "When are you planning your wedding?",
                    subtitle: "Your ideal timeline helps us prepare better.",
                    type: 'radio',
                    field: 'timeline',
                    options: ['Within 3 months', '3–6 months', '6–12 months', '12+ months', 'Date not decided yet']
                },
                {
                    num: '05',
                    question: "What are you looking to plan?",
                    subtitle: "Select the celebration you need help with.",
                    type: 'radio',
                    field: 'weddingType',
                    options: ['Complete Wedding', 'Wedding Ceremony', 'Reception', 'Haldi / Mehendi / Sangeet', 'Destination Wedding', 'Other']
                },
                {
                    num: '06',
                    question: "What is your approximate wedding budget?",
                    subtitle: "This helps us recommend the right options for you.",
                    type: 'radio',
                    field: 'budget',
                    options: ['₹10–20 Lakhs', '₹20–35 Lakhs', '₹35–50 Lakhs', '₹50 Lakhs–₹1 Crore', '₹1 Crore+']
                }
            ];

            const currentStep = steps[step];
            const totalSteps = steps.length;
            const progress = ((step + 1) / totalSteps) * 100;

            const canProceed = () => {
                if (currentStep.type === 'text' || currentStep.type === 'tel') {
                    return formData[currentStep.field].trim().length > 0;
                }
                return formData[currentStep.field] !== '';
            };

            const handleNext = () => {
                if (step < totalSteps - 1) {
                    setStep(step + 1);
                } else {
                    setSubmitted(true);
                    console.log('Form submitted:', formData);
                }
            };

            const handleBack = () => {
                if (step > 0) setStep(step - 1);
            };

            const handleRadioSelect = (value) => {
                setFormData(prev => ({ ...prev, [currentStep.field]: value }));
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' && canProceed()) {
                    handleNext();
                }
            };

            if (submitted) {
                return (
                    <div className="min-h-screen flex items-center justify-center px-5">
                        <div className="text-center max-w-md fade-up visible">
                            <div className="w-20 h-20 bg-gold/10 rounded-full flex items-center justify-center mx-auto mb-6">
                                <i className="fas fa-check text-gold text-3xl"></i>
                            </div>
                            <h1 className="font-display text-3xl md:text-4xl mb-4">
                                Thank You, {formData.name.split(' ')[0]}!
                            </h1>
                            <p className="text-secondary text-sm leading-relaxed mb-2">
                                Your wedding enquiry has been received.
                            </p>
                            <p className="text-secondary text-sm leading-relaxed mb-8">
                                Our wedding team will reach out to you on <span className="font-semibold text-warm-dark">{formData.phone}</span> within 24 hours.
                            </p>
                            <a href="index.html" className="inline-flex items-center gap-2 bg-warm-dark text-white px-8 py-3 rounded-full text-xs tracking-widest font-semibold hover:bg-gold transition-all">
                                <i className="fas fa-arrow-left text-[10px]"></i> BACK TO WEBSITE
                            </a>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col" ref={ref}>
                    {/* Progress */}
                    <div className="px-5 md:px-8 pt-6 pb-2 max-w-3xl mx-auto w-full">
                        <div className="flex items-center justify-between mb-2">
                            <span className="text-[10px] tracking-[0.2em] text-light uppercase">
                                Step {step + 1} of {totalSteps}
                            </span>
                            <span className="text-[10px] tracking-[0.2em] text-gold font-medium uppercase">
                                Sky Events
                            </span>
                        </div>
                        <div className="w-full h-1 bg-gray-200 rounded-full overflow-hidden">
                            <div className="h-full bg-gold rounded-full transition-all duration-500 ease-out" style={{width: `${progress}%`}}></div>
                        </div>
                    </div>

                    {/* Question */}
                    <div className="flex-1 flex flex-col justify-center px-5 md:px-8 py-8 max-w-3xl mx-auto w-full">
                        <div className={`fade-up ${isVisible ? 'visible' : ''}`}>
                            <p className="text-gold text-[11px] tracking-[0.2em] font-medium mb-3 uppercase">
                                {currentStep.num}
                            </p>
                            <h1 className="font-display text-2xl md:text-4xl lg:text-5xl mb-2 leading-tight">
                                {currentStep.question}
                            </h1>
                            <p className="text-secondary text-sm mb-8 md:mb-10">
                                {currentStep.subtitle}
                            </p>

                            {currentStep.type === 'text' || currentStep.type === 'tel' ? (
                                <div className="max-w-lg">
                                    <input
                                        type={currentStep.type}
                                        value={formData[currentStep.field]}
                                        onChange={e => setFormData(prev => ({ ...prev, [currentStep.field]: e.target.value }))}
                                        onKeyDown={handleKeyDown}
                                        placeholder={currentStep.placeholder}
                                        className="form-input text-lg"
                                        autoFocus
                                    />
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 max-w-2xl">
                                    {currentStep.options.map((option, i) => (
                                        <RadioCard
                                            key={i}
                                            label={option}
                                            selected={formData[currentStep.field] === option}
                                            onClick={() => handleRadioSelect(option)}
                                        />
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Navigation */}
                    <div className="px-5 md:px-8 pb-8 max-w-3xl mx-auto w-full">
                        <div className="flex items-center justify-between">
                            <button
                                onClick={handleBack}
                                disabled={step === 0}
                                className={`flex items-center gap-2 text-xs tracking-wider font-medium transition-all ${
                                    step === 0 ? 'opacity-0 pointer-events-none' : 'text-secondary hover:text-warm-dark'
                                }`}>
                                <i className="fas fa-arrow-left text-[10px]"></i> BACK
                            </button>

                            <button
                                onClick={handleNext}
                                disabled={!canProceed()}
                                className={`flex items-center gap-2 px-8 py-3.5 rounded-full text-xs tracking-widest font-semibold transition-all ${
                                    canProceed()
                                        ? 'bg-warm-dark text-white hover:bg-gold shadow-sm'
                                        : 'bg-gray-200 text-gray-400 cursor-not-allowed'
                                }`}>
                                {step === totalSteps - 1 ? (
                                    <>PLAN MY WEDDING <i className="fas fa-arrow-right text-[10px]"></i></>
                                ) : (
                                    <>CONTINUE <i className="fas fa-arrow-right text-[10px]"></i></>
                                )}
                            </button>
                        </div>
                    </div>

                    {/* Dots */}
                    <div className="flex justify-center gap-1.5 pb-6">
                        {steps.map((_, i) => (
                            <button key={i} onClick={() => i <= step && setStep(i)}
                                className={`h-1.5 rounded-full transition-all duration-400 ${
                                    i === step ? 'bg-gold w-6' :
                                    i < step ? 'bg-gold/40 w-1.5 cursor-pointer' :
                                    'bg-gray-300 w-1.5'
                                }`}>
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        // ─── APP ───────────────────────────────────────────────
        const App = () => (
            <div>
                <Header />
                <EnquiryForm />
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
